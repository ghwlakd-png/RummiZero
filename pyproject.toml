[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rummizero"
version = "0.4.0"
description = "Headless Rummikub self-play research scaffold"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "RummiZero contributors"}]
dependencies = ["numpy>=1.26", "rummikub-solver>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rummizero = "rummizero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
